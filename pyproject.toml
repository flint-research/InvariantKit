[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantkit"
dynamic = ["version"]
description = "Validate InvariantKit definitions and report existing Foundry test results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
invariantkit = "invariantkit.cli:main"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["invariantkit"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "invariantkit.__version__"}

[tool.setuptools.package-data]
invariantkit = ["schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["cli"]
testpaths = ["cli/tests"]
